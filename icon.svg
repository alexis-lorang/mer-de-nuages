<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a47"/>
      <stop offset=".38" stop-color="#3b3a85"/>
      <stop offset=".6" stop-color="#9a5f95"/>
      <stop offset=".75" stop-color="#f09a7c"/>
    </linearGradient>
    <radialGradient id="glow" cx="680" cy="560" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe2a6" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#ffb877" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff8f70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4f8f"/>
      <stop offset="1" stop-color="#40407a"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3f74"/>
      <stop offset="1" stop-color="#2a2c57"/>
    </linearGradient>
    <linearGradient id="shade" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22244a"/>
      <stop offset="1" stop-color="#171936"/>
    </linearGradient>
    <linearGradient id="cloudBack" x1="0" y1="580" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9e6f7"/>
      <stop offset="1" stop-color="#c9c6e6"/>
    </linearGradient>
    <linearGradient id="cloudFront" x1="0" y1="660" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e3f5"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <g fill="#fff">
    <circle cx="190" cy="170" r="5" opacity=".8"/>
    <circle cx="300" cy="110" r="3.5" opacity=".6"/>
    <circle cx="420" cy="200" r="3" opacity=".5"/>
    <circle cx="820" cy="150" r="4.5" opacity=".7"/>
    <circle cx="900" cy="250" r="3" opacity=".5"/>
    <circle cx="110" cy="320" r="3" opacity=".45"/>
  </g>

  <circle cx="680" cy="560" r="420" fill="url(#glow)"/>
  <circle cx="680" cy="560" r="96" fill="#ffe9bd"/>

  <!-- Crêtes lointaines -->
  <path d="M0 640 L170 470 L300 560 L400 500 L520 620 L700 520 L860 600 L1024 480 L1024 820 L0 820 Z" fill="url(#far)"/>

  <!-- Sommet principal : face éclairée et face à l'ombre -->
  <path d="M120 800 L478 290 Q500 262 522 290 L920 800 Z" fill="url(#shade)"/>
  <path d="M500 276 Q511 272 522 290 L920 800 L570 800 L540 520 Z" fill="url(#lit)"/>
  <path d="M500 276 Q511 272 522 290 L690 505" fill="none" stroke="#ffc9a0" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>

  <!-- Mer de nuages -->
  <g fill="url(#cloudBack)" transform="translate(0 30)">
    <circle cx="40" cy="690" r="90"/><circle cx="170" cy="660" r="80"/><circle cx="300" cy="690" r="95"/>
    <circle cx="700" cy="680" r="90"/><circle cx="840" cy="655" r="85"/><circle cx="980" cy="685" r="95"/>
    <rect x="0" y="690" width="1024" height="334"/>
  </g>
  <g fill="url(#cloudFront)" transform="translate(0 30)">
    <circle cx="-10" cy="790" r="100"/><circle cx="140" cy="755" r="95"/><circle cx="300" cy="785" r="105"/>
    <circle cx="470" cy="760" r="100"/><circle cx="630" cy="790" r="105"/><circle cx="790" cy="755" r="100"/>
    <circle cx="950" cy="780" r="105"/><circle cx="1080" cy="760" r="90"/>
    <rect x="0" y="790" width="1024" height="234"/>
  </g>
</svg>
