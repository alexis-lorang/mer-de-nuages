<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mers de nuages</title>
  <meta name="description" content="Prévision des mers de nuages dans les Vosges du Nord">
  <meta name="theme-color" content="#090d18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mers de nuages">
  <link rel="apple-touch-icon" sizes="180x180" href="https://alexis-lorang.github.io/mer-de-nuages/apple-touch-icon-180x180.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://alexis-lorang.github.io/mer-de-nuages/apple-touch-icon-precomposed.png">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <script>
    // Thème choisi (ou celui de l'iPhone) appliqué avant l'affichage de la page.
    (function () {
      var p = 'auto';
      try { p = localStorage.getItem('mdn-theme') || 'auto'; } catch (e) { /* stockage indisponible */ }
      var light = p === 'light' || (p === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
      var root = document.documentElement;
      root.dataset.theme = light ? 'light' : 'dark';
      if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) root.classList.add('standalone');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f2f2f7' : '#090d18');
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>
  <script>
    // Ouvert en double-cliquant sur index.html : les modules JS sont bloqués en file://.
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', () => {
        document.body.insertAdjacentHTML('afterbegin',
          '<div class="file-warning">Ouvre l’application via le serveur local : double-clique sur <b>« Lancer le dashboard.command »</b>.</div>');
      });
    }
  </script>

  <!-- Accueil -->
  <section class="page" id="home" aria-label="Accueil">
    <div class="glows" aria-hidden="true"><div class="glow on" data-glow="home"></div></div>
    <div class="ptr" aria-hidden="true"></div>
    <div class="scroller">
      <div class="large-title with-action">
        <div>
          <h1>Mers de nuages</h1>
          <p class="subtitle" id="updated">Vosges du Nord</p>
        </div>
        <button class="icon-btn" data-action="settings" aria-label="Réglages"></button>
      </div>
      <main id="home-body" class="content"></main>
    </div>
  </section>

  <!-- Détail d'un lieu -->
  <section class="page" id="detail" aria-label="Détail du lieu" inert>
    <div class="glows" aria-hidden="true">
      <div class="glow" data-glow="top"></div>
      <div class="glow" data-glow="good"></div>
      <div class="glow" data-glow="maybe"></div>
      <div class="glow on" data-glow="low"></div>
    </div>
    <div class="scroller">
      <main id="detail-body" class="content"></main>
    </div>
    <button class="back-fab" data-action="back"><span class="back-ic"></span><span>Lieux</span></button>
  </section>

  <!-- Feuille modale (réglages, webcams) -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-panel">
      <div class="sheet-grab" aria-hidden="true"><i></i></div>
      <div class="sheet-head">
        <span></span>
        <h2 id="sheet-title" tabindex="-1" autofocus></h2>
        <button class="sheet-close" data-action="close-sheet" aria-label="Fermer"></button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </dialog>

  <script type="module" src="js/app.js?v=28"></script>
</body>
</html>
