<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mers de nuages</title>
  <meta name="description" content="Prévision des mers de nuages dans les Vosges du Nord">
  <meta name="theme-color" content="#090d18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mers de nuages">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <script>
    // Ouvert en double-cliquant sur index.html : les modules JS sont bloqués en file://.
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', () => {
        document.body.insertAdjacentHTML('afterbegin',
          '<div class="file-warning">Ouvre l’application via le serveur local : double-clique sur <b>« Lancer le dashboard.command »</b>.</div>');
      });
    }
  </script>

  <!-- Accueil -->
  <section class="page" id="home" aria-label="Accueil">
    <div class="glows" aria-hidden="true"><div class="glow on" data-glow="home"></div></div>
    <header class="navbar">
      <div class="nav-side"></div>
      <div class="nav-title">Mers de nuages</div>
      <div class="nav-side right">
        <button class="icon-btn" data-action="settings" aria-label="Réglages"></button>
      </div>
    </header>
    <div class="ptr" aria-hidden="true"><span class="ptr-spin"></span></div>
    <div class="scroller">
      <div class="large-title">
        <h1>Mers de nuages</h1>
        <p class="subtitle" id="updated">Vosges du Nord</p>
      </div>
      <main id="home-body" class="content"></main>
    </div>
  </section>

  <!-- Détail d'un lieu -->
  <section class="page" id="detail" aria-label="Détail du lieu" inert>
    <div class="glows" aria-hidden="true">
      <div class="glow" data-glow="top"></div>
      <div class="glow" data-glow="good"></div>
      <div class="glow" data-glow="maybe"></div>
      <div class="glow on" data-glow="low"></div>
    </div>
    <header class="navbar">
      <div class="nav-side">
        <button class="back-btn" data-action="back"><span class="back-ic"></span><span>Lieux</span></button>
      </div>
      <div class="nav-title" id="detail-nav-title"></div>
      <div class="nav-side right"></div>
    </header>
    <div class="scroller">
      <main id="detail-body" class="content"></main>
    </div>
  </section>

  <!-- Feuille modale (réglages, webcams) -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-panel">
      <div class="sheet-grab" aria-hidden="true"><i></i></div>
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="sheet-done" data-action="close-sheet">OK</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </dialog>

  <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
